stages:
  - build
  - deploy

variables:
  FRONTEND_DEPLOY_BASE: "/data/cicd/frontend/nova"

build-develop:
  extends: .build-template
  variables:
    HOST: "$DEVELOP_HOST"
    ENVIRONMENT: "develop"
  rules:
    - if: '$CI_COMMIT_TAG =~ /^nova-develop-v.+$/'

deploy-develop:
  extends: .deploy-template
  needs:
    - job: build-develop
      artifacts: true
  variables:
    HOST: "$DEVELOP_HOST"
    ENVIRONMENT: "develop"
    EXTERNAL_PORT: "4003"
  rules:
    - if: '$CI_COMMIT_TAG =~ /^nova-develop-v.+$/'
      when: on_success

build-production:
  extends: .build-template
  variables:
    HOST: "$PRODUCTION_HOST"
    ENVIRONMENT: "production"
  rules:
    - if: '$CI_COMMIT_TAG =~ /^nova-production-v.+$/'

deploy-production:
  extends: .deploy-template
  needs:
    - job: build-production
      artifacts: true
  variables:
    HOST: "$PRODUCTION_HOST"
    ENVIRONMENT: "production"
    EXTERNAL_PORT: "4002"
  rules:
    - if: '$CI_COMMIT_TAG =~ /^nova-production-v.+$/'
      when: on_success

.build-template:
  stage: build
  image: docker:latest
  before_script:
    - export VERSION="${CI_COMMIT_TAG#nova-${ENVIRONMENT}-}"
    - |
      if [ "$ENVIRONMENT" = "develop" ]; then
        export DOCKER_IMAGE_TAG="develop-${VERSION}"
      else
        export DOCKER_IMAGE_TAG="${VERSION}"
      fi
    - mkdir -p ~/.ssh
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/id_rsa
    - chmod 600 ~/.ssh/id_rsa
    - ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts
  script:
    - echo "DOCKER_IMAGE_TAG=$DOCKER_IMAGE_TAG" > variables.env
    - export IMAGE_NAME="nova-frontend:${DOCKER_IMAGE_TAG}"
    - docker build -t "$IMAGE_NAME" .
    - docker save "$IMAGE_NAME" | gzip > nova-frontend.tar.gz
    - export DEPLOY_DIR="${FRONTEND_DEPLOY_BASE}_${ENVIRONMENT}/"
    - ssh "$HOST" "mkdir -p '${DEPLOY_DIR}'"
    - scp nova-frontend.tar.gz "$HOST:${DEPLOY_DIR}nova-frontend.tar.gz"
    - scp docker-compose.yml "$HOST:${DEPLOY_DIR}docker-compose.yml"
  artifacts:
    expire_in: 1 day
    reports:
      dotenv: variables.env
    paths:
      - variables.env

.deploy-template:
  stage: deploy
  image: docker:latest
  before_script:
    - mkdir -p ~/.ssh
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/id_rsa
    - chmod 600 ~/.ssh/id_rsa
    - ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts
  script:
    - export DEPLOY_DIR="${FRONTEND_DEPLOY_BASE}_${ENVIRONMENT}/"
    - ssh "$HOST" "cd '${DEPLOY_DIR}' && gunzip -c nova-frontend.tar.gz | docker load"
    - |
      printf '%s\n' \
        "VERSION=${DOCKER_IMAGE_TAG}" \
        "EXTERNAL_PORT=${EXTERNAL_PORT}" \
        "COMPOSE_PROJECT_NAME=nova-frontend-${ENVIRONMENT}" > compose.env
    - scp compose.env "$HOST:${DEPLOY_DIR}.env"
    - ssh "$HOST" "cd '${DEPLOY_DIR}' && docker compose up -d --remove-orphans"